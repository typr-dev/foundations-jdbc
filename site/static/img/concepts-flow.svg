<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <linearGradient id="gFragment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gTemplate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gOperation" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="gResult" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gSupport" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Concepts at a Glance</text>

  <!-- ═══ MAIN FLOW (y=170): Fragment → Operation → Result ═══ -->

  <!-- Fragment -->
  <rect x="80" y="145" width="160" height="56" rx="10" fill="url(#gFragment)" filter="url(#shadow)"/>
  <text x="160" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="white">Fragment</text>
  <text x="160" y="186" text-anchor="middle" font-size="10.5" fill="rgba(255,255,255,0.8)">SQL + bound params</text>

  <!-- Arrow: Fragment → Operation (solid, main path) -->
  <line x1="240" y1="173" x2="430" y2="173" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="280" y="148" width="110" height="20" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="335" y="162" text-anchor="middle" font-size="11" fill="#475569" font-family="'SF Mono', 'Fira Code', monospace">.query() / .update()</text>

  <!-- Operation -->
  <rect x="436" y="145" width="160" height="56" rx="10" fill="url(#gOperation)" filter="url(#shadow)"/>
  <text x="516" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="white">Operation</text>
  <text x="516" y="186" text-anchor="middle" font-size="10.5" fill="rgba(255,255,255,0.8)">runnable DB action</text>

  <!-- Arrow: Operation → Result (solid) -->
  <line x1="596" y1="173" x2="700" y2="173" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="606" y="148" width="84" height="20" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="648" y="162" text-anchor="middle" font-size="11" fill="#475569" font-family="'SF Mono', 'Fira Code', monospace">.transact()</text>

  <!-- Result -->
  <rect x="706" y="145" width="100" height="56" rx="10" fill="url(#gResult)" filter="url(#shadow)"/>
  <text x="756" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="white">Result</text>
  <text x="756" y="186" text-anchor="middle" font-size="10.5" fill="rgba(255,255,255,0.8)">your data</text>

  <!-- ═══ SIDE PATH: Fragment → Template → Operation (dashed) ═══ -->

  <!-- Template (below main flow) -->
  <rect x="206" y="270" width="160" height="50" rx="10" fill="url(#gTemplate)" filter="url(#shadow)" opacity="0.85"/>
  <text x="286" y="293" text-anchor="middle" font-size="14" font-weight="700" fill="white">Template</text>
  <text x="286" y="307" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">reusable param holes</text>

  <!-- Dashed arrow: Fragment → Template -->
  <path d="M 160 201 C 160 245, 286 245, 286 270" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arr-dash)"/>
  <rect x="140" y="228" width="70" height="20" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="175" y="242" text-anchor="middle" font-size="11" fill="#64748b" font-family="'SF Mono', 'Fira Code', monospace">.param()</text>

  <!-- Dashed arrow: Template → Operation -->
  <path d="M 366 295 C 430 295, 516 260, 516 201" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arr-dash)"/>
  <rect x="410" y="262" width="70" height="20" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="445" y="276" text-anchor="middle" font-size="11" fill="#64748b" font-family="'SF Mono', 'Fira Code', monospace">.on(val)</text>

  <!-- "Advanced" label near Template path -->
  <text x="286" y="340" text-anchor="middle" font-size="10" fill="#94a3b8" font-style="italic">Advanced: reusable param holes</text>

  <!-- ═══ SUPPORTING CONCEPTS (top row, y=70) ═══ -->

  <!-- DbType -->
  <rect x="100" y="58" width="120" height="44" rx="8" fill="url(#gSupport)" filter="url(#shadow)"/>
  <text x="160" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="white">DbType</text>
  <text x="160" y="92" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.7)">column type codec</text>

  <!-- RowCodec -->
  <rect x="280" y="58" width="120" height="44" rx="8" fill="url(#gSupport)" filter="url(#shadow)"/>
  <text x="340" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="white">RowCodec</text>
  <text x="340" y="92" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.7)">row ↔ record map</text>

  <!-- Transactor -->
  <rect x="630" y="58" width="120" height="44" rx="8" fill="url(#gSupport)" filter="url(#shadow)"/>
  <text x="690" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="white">Transactor</text>
  <text x="690" y="92" text-anchor="middle" font-size="9.5" fill="rgba(255,255,255,0.7)">connection + tx mgmt</text>

  <!-- Dashed connectors from support to main -->
  <line x1="160" y1="102" x2="160" y2="145" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="340" y1="102" x2="335" y2="148" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="690" y1="102" x2="648" y2="148" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ═══ LEGEND / ANNOTATION (bottom) ═══ -->
  <rect x="40" y="360" width="876" height="30" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Legend items -->
  <rect x="60" y="369" width="12" height="12" rx="3" fill="url(#gFragment)"/>
  <text x="78" y="380" font-size="11" fill="#475569">Build SQL</text>

  <text x="138" y="380" font-size="14" fill="#cbd5e1">→</text>

  <rect x="158" y="369" width="12" height="12" rx="3" fill="url(#gOperation)"/>
  <text x="176" y="380" font-size="11" fill="#475569">Create operation</text>

  <text x="276" y="380" font-size="14" fill="#cbd5e1">→</text>

  <rect x="296" y="369" width="12" height="12" rx="3" fill="url(#gResult)"/>
  <text x="314" y="380" font-size="11" fill="#475569">Execute &amp; get results</text>

  <line x1="470" y1="375" x2="490" y2="375" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="498" y="380" font-size="11" fill="#475569">Advanced: Template path for reusable param holes</text>
</svg>
