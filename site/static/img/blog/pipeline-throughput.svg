<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" font-family="Inter, system-ui, -apple-system, sans-serif">
  <!-- Title -->
  <text x="400" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">Pipeline: All queries in a single round-trip</text>

  <!-- Connection 1 -->
  <text x="16" y="68" font-size="12" font-weight="500" fill="#6b7280">Conn 1</text>

  <!-- Q1 Q2 Q3 packed together -->
  <rect x="80" y="50" width="50" height="28" rx="4" fill="#059669"/>
  <text x="105" y="68" text-anchor="middle" font-size="11" font-weight="500" fill="white">Q1</text>

  <rect x="132" y="50" width="50" height="28" rx="4" fill="#059669"/>
  <text x="157" y="68" text-anchor="middle" font-size="11" font-weight="500" fill="white">Q2</text>

  <rect x="184" y="50" width="50" height="28" rx="4" fill="#059669"/>
  <text x="209" y="68" text-anchor="middle" font-size="11" font-weight="500" fill="white">Q3</text>

  <!-- Single flight arrow -->
  <line x1="240" y1="64" x2="340" y2="64" stroke="#059669" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="340,60 350,64 340,68" fill="#059669"/>
  <text x="295" y="56" text-anchor="middle" font-size="10" fill="#059669" font-style="italic">1 flush</text>

  <!-- Server processing -->
  <rect x="355" y="50" width="80" height="28" rx="4" fill="#7c3aed" opacity="0.8"/>
  <text x="395" y="68" text-anchor="middle" font-size="10" font-weight="500" fill="white">PG processes</text>

  <!-- Return flight -->
  <line x1="440" y1="64" x2="510" y2="64" stroke="#059669" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="510,60 520,64 510,68" fill="#059669"/>

  <!-- R1 R2 R3 streaming back -->
  <rect x="525" y="50" width="40" height="28" rx="4" fill="#059669"/>
  <text x="545" y="68" text-anchor="middle" font-size="11" font-weight="500" fill="white">R1</text>

  <rect x="567" y="50" width="40" height="28" rx="4" fill="#059669"/>
  <text x="587" y="68" text-anchor="middle" font-size="11" font-weight="500" fill="white">R2</text>

  <rect x="609" y="50" width="40" height="28" rx="4" fill="#059669"/>
  <text x="629" y="68" text-anchor="middle" font-size="11" font-weight="500" fill="white">R3</text>

  <!-- Timeline arrow -->
  <line x1="80" y1="100" x2="670" y2="100" stroke="#d1d5db" stroke-width="1.5"/>
  <polygon points="670,96 680,100 670,104" fill="#d1d5db"/>
  <text x="690" y="104" font-size="10" fill="#9ca3af">time</text>

  <!-- Total time bracket -->
  <line x1="80" y1="120" x2="80" y2="135" stroke="#059669" stroke-width="1.5"/>
  <line x1="80" y1="135" x2="649" y2="135" stroke="#059669" stroke-width="1.5"/>
  <line x1="649" y1="120" x2="649" y2="135" stroke="#059669" stroke-width="1.5"/>
  <text x="365" y="155" text-anchor="middle" font-size="12" font-weight="600" fill="#059669">3 queries = 1 round-trip = 10ms</text>

  <!-- Speedup callout -->
  <rect x="550" y="120" width="100" height="28" rx="14" fill="#059669"/>
  <text x="600" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="white">3x faster</text>
</svg>
