name: Build

on:
  push:
    tags: [ 'v*' ]
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: bleep-build/bleep-setup-action@0.0.1
      - uses: coursier/cache-action@v6
        with:
          extraFiles: bleep.yaml

      - name: Compile
        run: bleep compile foundations-jdbc foundations-jdbc-hikari foundations-jdbc-spring foundations-jdbc-kotlin foundations-jdbc-scala foundations-jdbc-test foundations-jdbc-scanner-test

      - name: Assert clean repo
        run: git diff --exit-code

  test-duckdb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - uses: bleep-build/bleep-setup-action@0.0.1
      - uses: coursier/cache-action@v6
        with:
          extraFiles: bleep.yaml

      - name: Run DuckDB tests
        run: bleep test foundations-jdbc-test -o dev.typr.foundations.DuckDbTypeTest

  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - uses: bleep-build/bleep-setup-action@0.0.1
      - uses: coursier/cache-action@v6
        with:
          extraFiles: bleep.yaml

      - name: Run PostgreSQL tests
        run: bleep test foundations-jdbc-test -o dev.typr.foundations.PgTypeTest -o dev.typr.foundations.PgStructTest -o dev.typr.foundations.PgRecordParserTest

  test-mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - uses: bleep-build/bleep-setup-action@0.0.1
      - uses: coursier/cache-action@v6
        with:
          extraFiles: bleep.yaml

      - name: Run MariaDB tests
        run: bleep test foundations-jdbc-test -o dev.typr.foundations.MariaTypeTest

  test-sqlserver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - uses: bleep-build/bleep-setup-action@0.0.1
      - uses: coursier/cache-action@v6
        with:
          extraFiles: bleep.yaml

      - name: Run SQL Server tests
        run: bleep test foundations-jdbc-test -o dev.typr.foundations.SqlServerTypeTest

  test-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - uses: bleep-build/bleep-setup-action@0.0.1
      - uses: coursier/cache-action@v6
        with:
          extraFiles: bleep.yaml

      - name: Run Oracle tests
        run: bleep test foundations-jdbc-test -o dev.typr.foundations.OracleTypeTest

  test-db2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - uses: bleep-build/bleep-setup-action@0.0.1
      - uses: coursier/cache-action@v6
        with:
          extraFiles: bleep.yaml

      - name: Run DB2 tests
        run: bleep test foundations-jdbc-test -o dev.typr.foundations.Db2TypeTest

  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [compile, test-duckdb, test-postgres]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bleep-build/bleep-setup-action@0.0.1
      - uses: coursier/cache-action@v6
        with:
          extraFiles: bleep.yaml

      - name: Publish
        run: bleep --dev publish
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
