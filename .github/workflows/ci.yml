name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: ./gradlew compileJava compileScala compileTestJava

      - name: Run unit tests
        run: ./gradlew :foundations-jdbc-test:test --tests "dev.typr.foundations.DuckDbTypeTest" --tests "dev.typr.foundations.PgRecordParserTest"

      - name: Compile documentation examples
        run: ./gradlew :documentation-examples-java:compileJava :documentation-examples-kotlin:compileKotlin :documentation-examples-scala:compileScala

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Build documentation site
        working-directory: site
        run: |
          npm ci
          npm run build
