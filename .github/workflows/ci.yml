name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: ./gradlew compileJava compileScala compileTestJava

      - name: Run unit tests
        run: ./gradlew :foundations-jdbc-test:test --tests "dev.typr.foundations.DuckDbTypeTest" --tests "dev.typr.foundations.PgRecordParserTest"
