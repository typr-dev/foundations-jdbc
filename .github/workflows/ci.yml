name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: bleep-build/bleep-setup-action@0.0.1
      - uses: coursier/cache-action@v6
        with:
          extraFiles: bleep.yaml

      - name: Compile
        run: bleep compile foundations-jdbc foundations-jdbc-hikari foundations-jdbc-spring foundations-jdbc-kotlin foundations-jdbc-scala foundations-jdbc-test

      - name: Run unit tests
        run: bleep test foundations-jdbc-test -o dev.typr.foundations.DuckDbTypeTest -o dev.typr.foundations.PgRecordParserTest

      - name: Compile documentation examples
        run: bleep compile documentation-examples-java documentation-examples-kotlin documentation-examples-scala

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Build documentation site
        working-directory: site
        run: |
          npm ci
          npm run build
